name: parity
on: {push: {branches: [main]}, pull_request: {}}
jobs:
  lattice-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -e ".[dev]" triton
      - run: pytest -q
      - run: python demos/demo.py
